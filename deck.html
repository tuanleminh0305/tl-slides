<style>
:root{--bg:#f6f6f4;--fg:#1d1d1b;--mut:#6b6b66;--line:#d9d9d4;--card:#fff;--acc:#1d1d1b;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ededea;--mut:#9a9a94;--line:#33332f;--card:#1f1f1d;--acc:#ededea;--err:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:8px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg)}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--acc);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
p{margin:10px 0 0;font-size:14px;color:var(--err);min-height:1.5em}
</style>
